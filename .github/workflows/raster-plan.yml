name: Raster composition plans
on:
  pull_request:
    paths:
      - 'runner/src/snes/raster_plan.h'
      - 'runner/src/snes/raster_jobs.h'
      - 'runner/src/snes/raster_register_*.h'
      - 'runner/src/snes/ppu_register*'
      - 'runner/src/snes/ppu.h'
      - 'tests/ppu/ppu_registers_contract_test.c'
      - 'runner/tests/raster_plan/**'
      - '.github/workflows/raster-plan.yml'
  push:
    branches: [main]
    paths:
      - 'runner/src/snes/raster_plan.h'
      - 'runner/src/snes/raster_jobs.h'
      - 'runner/src/snes/raster_register_*.h'
      - 'runner/src/snes/ppu_register*'
      - 'runner/src/snes/ppu.h'
      - 'tests/ppu/ppu_registers_contract_test.c'
      - 'runner/tests/raster_plan/**'
      - '.github/workflows/raster-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S runner/tests/raster_plan -B build-raster-plan -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-raster-plan --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-raster-plan -C Release --output-on-failure
